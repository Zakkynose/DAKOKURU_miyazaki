<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <title layout:title-pattern="$CONTENT_TITLE - 打刻システム">打刻システム</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
		
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header>
            <div class="navbar">
                <div class="logo">
                    <img th:src="@{/images/DAKOKURU.jpg}" alt="DAKOKURU">
                </div>
                <nav id=navigation>
                    <ul>
                        <li class="current-item"><a th:href="@{/user/index}">【管理】ユーザー一覧</a></li>
                        <li><a th:href="@{/users_daily_timestamps/{period}(period=${#dates.format(#dates.createNow(), 'yyyy-MM')})}">【管理】打刻集計</a></li>
                        <li><a th:href="@{/department/index}">【管理】部署一覧</a></li>
                        <li><a th:href="@{/workPlace/index}">【管理】勤務地一覧</a></li>
                    </ul>
                    <span id="slide-line"></span>
                </nav>
                <div class="user-info">
                    <span>ユーザー名</span>
                </div>
            </div>
        </header>
    
        <main layout:fragment="content">
            <!-- 各ページのコンテンツがここに入る -->
        </main>
		
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigF/h/6tVROwA8q95" crossorigin="anonymous"></script>
		<script>
		    document.addEventListener("DOMContentLoaded", function() { // ページの読み込み完了を待つ (jQueryの $(function(){}) と同じ意味)
		        // JavaScriptではDOM要素を直接取得します
		        let $nav = document.getElementById("navigation"),
		            $slideLine = document.getElementById("slide-line"),
		            $currentItem = document.querySelector(".current-item");
		        
		        // 要素が取得できたら処理を実行
		        if ($nav && $slideLine) {
		            
		            // メニューにアクティブな項目がある場合
		            if ($currentItem) {
		                $slideLine.style.width = ($currentItem.offsetWidth + 10) + "px";
		                $slideLine.style.left = ($currentItem.offsetLeft + 5) + "px";
		            }
		            
		            // 下線のトランジション (Vanilla JSでホバーイベントを処理)
		            $nav.querySelectorAll("li").forEach(function(li) {
		                li.addEventListener('mouseover', function(){
		                    $slideLine.style.width = (li.offsetWidth + 10) + "px";
		                    $slideLine.style.left = (li.offsetLeft + 5) + "px";
		                });
		                li.addEventListener('mouseout', function(){
		                    if ($currentItem) {
		                        // 現在の項目に戻す
		                        $slideLine.style.width = ($currentItem.offsetWidth + 10) + "px";
		                        $slideLine.style.left = ($currentItem.offsetLeft + 5) + "px";
		                    } else {
		                        // 非表示にする
		                        $slideLine.style.width = "0px";
		                    }
		                });
		            });
		        }
		    });
		</script>
    </body>
</html>
